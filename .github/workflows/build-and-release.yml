name: Build and Release UploadPulse

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test and Build (Windows x64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Frontend Assets
        run: npm run build

      - name: Ensure Dist Directory Exists
        run: mkdir -p dist && touch dist/.gitkeep

      - name: Run Go Unit Tests & AST Guard
        run: go test -v ./...

      - name: Embed Windows GUI Manifest & Resources
        run: |
          go install github.com/tc-hib/go-winres@latest
          $(go env GOPATH)/bin/go-winres simply --arch amd64 --manifest gui --file-description "UploadPulse - Windows 11 Upload Speed Tester" --product-name "UploadPulse" --copyright "Copyright 2026 UploadPulse" --original-filename "UploadPulse-windows-amd64.exe"

      - name: Compile Production 64-bit Windows 11 Executable
        run: |
          GOOS=windows GOARCH=amd64 go build -tags desktop,production -ldflags="-s -w -H windowsgui" -o UploadPulse-windows-amd64.exe .

      - name: Verify Windows Executable Produced
        run: |
          ls -lh UploadPulse-windows-amd64.exe
          file UploadPulse-windows-amd64.exe

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UploadPulse-Windows-x64
          path: UploadPulse-windows-amd64.exe

      - name: Determine Release Tag and Name
        id: release_meta
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="UploadPulse ${TAG_NAME}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
            RELEASE_NAME="UploadPulse v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: UploadPulse-windows-amd64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
