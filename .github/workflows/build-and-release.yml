name: Build and Release UploadPulse

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Native Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Ensure Dist Directory Exists
        shell: bash
        run: |
          mkdir -p dist
          touch dist/.gitkeep

      - name: Resolve Windows Dependencies & Tidy Modules
        run: |
          go get github.com/wailsapp/go-webview2/webviewloader@v1.0.17
          go mod tidy

      - name: Run Go Unit Tests & Strict AST Guard
        run: go test -v ./...

      - name: Install Wails v2 CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Clean Stale Resource Objects
        shell: bash
        run: rm -f *.syso

      - name: Build Native Windows 64-bit Executable with Wails
        run: |
          wails build -skipbindings -platform windows/amd64 -clean -webview2 download -ldflags="-s -w" -o UploadPulse.exe

      - name: Verify Windows Executable Produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/UploadPulse.exe")) {
            Write-Error "build/bin/UploadPulse.exe was not created!"
            exit 1
          }
          $item = Get-Item "build/bin/UploadPulse.exe"
          Write-Host "Success! Generated: $($item.FullName) - Size: $($item.Length) bytes"

      - name: Package Standalone Zip Archive
        shell: pwsh
        run: |
          Copy-Item "build/bin/UploadPulse.exe" -Destination "UploadPulse.exe"
          Compress-Archive -Path "UploadPulse.exe", "README.md", "LICENSE" -DestinationPath "UploadPulse-windows-amd64.zip" -Force
          Write-Host "Created UploadPulse-windows-amd64.zip successfully"

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UploadPulse-Windows-x64
          path: |
            UploadPulse.exe
            UploadPulse-windows-amd64.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets and Sync Android
        run: npm run build:android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Inspect Build Environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Android SDK Path ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --info --full-stacktrace --no-daemon

      - name: Upload Build Failure Reports and Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/logs/
          if-no-files-found: ignore

      - name: Verify and Package APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk UploadPulse-android.apk
          ls -la UploadPulse-android.apk

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UploadPulse-Android-APK
          path: UploadPulse-android.apk

  release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: UploadPulse-Windows-x64
          path: ./release-assets

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: UploadPulse-Android-APK
          path: ./release-assets

      - name: Determine Release Tag and Name
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="UploadPulse ${TAG_NAME}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
            RELEASE_NAME="UploadPulse v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: |
            ./release-assets/UploadPulse.exe
            ./release-assets/UploadPulse-windows-amd64.zip
            ./release-assets/UploadPulse-android.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
