name: Build and Release UploadPulse

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Native Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Ensure Dist Directory Exists
        shell: bash
        run: |
          mkdir -p dist
          touch dist/.gitkeep

      - name: Resolve Windows Dependencies & Tidy Modules
        run: |
          go get github.com/wailsapp/go-webview2/webviewloader@v1.0.17
          go mod tidy

      - name: Run Go Unit Tests & Strict AST Guard
        run: go test -v ./...

      - name: Install Wails v2 CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Build Native Windows 64-bit Executable with Wails
        run: |
          wails build -skipbindings -platform windows/amd64 -clean -webview2 download -ldflags="-s -w" -o UploadPulse.exe

      - name: Verify Windows Executable Produced
        shell: pwsh
        run: |
          if (-not (Test-Path "build/bin/UploadPulse.exe")) {
            Write-Error "build/bin/UploadPulse.exe was not created!"
            exit 1
          }
          $item = Get-Item "build/bin/UploadPulse.exe"
          Write-Host "Success! Generated: $($item.FullName) - Size: $($item.Length) bytes"

      - name: Package Standalone Zip Archive
        shell: pwsh
        run: |
          Copy-Item "build/bin/UploadPulse.exe" -Destination "UploadPulse.exe"
          Compress-Archive -Path "UploadPulse.exe", "README.md", "LICENSE" -DestinationPath "UploadPulse-windows-amd64.zip" -Force
          Write-Host "Created UploadPulse-windows-amd64.zip successfully"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UploadPulse-Windows-x64
          path: |
            UploadPulse.exe
            UploadPulse-windows-amd64.zip

      - name: Determine Release Tag and Name
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="UploadPulse ${TAG_NAME}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
            RELEASE_NAME="UploadPulse v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          files: |
            UploadPulse.exe
            UploadPulse-windows-amd64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
